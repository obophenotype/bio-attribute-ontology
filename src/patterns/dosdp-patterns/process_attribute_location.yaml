pattern_name: process_attribute_location
pattern_iri: http://purl.obolibrary.org/obo/oba/patterns/process_attribute_location.yaml

description: '

  Basic pattern for traits that captures a quality, such as size or rate which is a 
  characteristic of a biological process in some location.'

classes:
  quality: PATO:0000001
  thing: owl:Thing
  process: GO:0008150

relations:
  occurs_in: BFO:0000066
  characteristic_of: RO:0000052

annotationProperties:
  exact_synonym: oio:hasExactSynonym
  broad_synonym: oio:hasBroadSynonym
  narrow_synonym: oio:hasNarrowSynonym
  related_synonym: oio:hasRelatedSynonym
  xref: oio:hasDbXref

vars:
  attribute: "'quality'"
  location: "'thing'"
  process: "'process'"

data_list_vars:
  exact_synonyms: xsd:string  # add a list of exact synonyms
  broad_synonyms: xsd:string  # add a list of broad synonyms
  narrow_synonyms: xsd:string  # add a list of narrow synonyms
  related_synonyms: xsd:string  # add a list of related synonyms

name:
  text: "%s of %s in %s"
  vars:
    - attribute
    - process
    - location

def: 
  text: "The %s of a %s when measured in %s."
  vars:
    - attribute
    - process
    - location
  annotations:
    - annotationProperty: xref
      text: "AUTO:patterns/patterns/process_attribute_location"

annotations: 
  - annotationProperty: exact_synonym
    text: "%s %s %s"
    vars:
      - location
      - process
      - attribute
    annotations:
      - annotationProperty: xref
        text: "AUTO:patterns/patterns/process_attribute_location"

exact_synonym:
  value: exact_synonyms
broad_synonym:
  value: broad_synonyms
narrow_synonym:
  value: narrow_synonyms
related_synonym:
  value: related_synonyms


equivalentTo:
  text: "%s and 'characteristic_of' some (%s and 'occurs_in' some %s)"
  vars:
    - attribute
    - process
    - location



