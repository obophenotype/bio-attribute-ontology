---
pattern_name: disease_progression

pattern_iri: http://purl.obolibrary.org/obo/oba/patterns/disease_progression.yaml

description: 'A trait covering the progression of a disease over time. Intended
  to replace co-annotation of a disease term with a generic disease progression
  measurement term by a single composite trait, e.g. "Alzheimer disease
  progression trait".'

contributors:
  - https://orcid.org/0000-0001-6757-4744  # Arwa Ibrahim

classes:
  disease: MONDO:0000001
  progression: PATO:0002323  # temporal distribution quality

relations:
  characteristic_of: RO:0000052

annotationProperties:
  exact_synonym: oio:hasExactSynonym
  broad_synonym: oio:hasBroadSynonym
  narrow_synonym: oio:hasNarrowSynonym
  related_synonym: oio:hasRelatedSynonym
  xref: oio:hasDbXref
  contributor: dct:contributor

vars:
  disease: "'disease'"

data_list_vars:
  orcid: xsd:anyURI  # ORCID of contributor
  exact_synonyms: xsd:string
  broad_synonyms: xsd:string
  narrow_synonyms: xsd:string
  related_synonyms: xsd:string
  xrefs: xsd:anyURI

name:
  text: "%s progression trait"
  vars:
    - disease

annotations:
  - annotationProperty: exact_synonym
    text: "%s progression"
    vars:
      - disease

  - annotationProperty: exact_synonym
    text: "progression of %s"
    vars:
      - disease

  - annotationProperty: related_synonym
    text: "rate of progression of %s"
    vars:
      - disease

  - annotationProperty: contributor
    value: orcid

exact_synonym:
  value: exact_synonyms

broad_synonym:
  value: broad_synonyms

narrow_synonym:
  value: narrow_synonyms

related_synonym:
  value: related_synonyms

xref:
  value: xrefs

def:
  text: "The progression of %s over time."
  vars:
    - disease

equivalentTo:
  text: "'progression' and 'characteristic_of' some %s"
  vars:
    - disease
